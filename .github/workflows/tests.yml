name: Tests
on:
  push:
    branches: [main, build]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: System packages (FFmpeg, Redis)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg redis-server
      - name: Python packages
        run: pip install -r requirements.txt fakeredis pytest "moto[server]"
      - name: Cache Whisper models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-tiny-v1
      - name: Run tests
        run: python -m pytest tests -v
