name: Tests
on:
  pull_request:
  push:
    branches:
      - main
      - build
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Same Python as the Docker image
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: |
          # The tests stub Whisper, so skip it and PyTorch (several GB) here.
          # The Docker image still installs both.
          grep -vE '^(torch|openai-whisper)$' requirements.txt > requirements-ci.txt
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt jsonschema pytest

      - name: Run tests
        run: pytest tests/ -v

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check docker-compose.nextcloud.n8n.yml
        run: |
          cp .env.nextcloud.n8n.example .env.nextcloud.n8n
          docker compose --env-file .env.nextcloud.n8n -f docker-compose.nextcloud.n8n.yml config -q
